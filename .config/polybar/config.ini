[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #B294BB
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 22pt
radius = 2

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = ||
separator-foreground = ${colors.disabled}

font-0 = "JetBrains Mono Nerd Font:size=9,9;0"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = pipewire cpu memory battery systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %{A1:dunstify -t 3000 "$(xdotool getactivewindow getwindowname)":}%title:0:25:...%%{A}
label-empty = Desktop

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label =  %date%
label-foreground = ${colors.primary}

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/pipewire]
type = custom/script
exec = ~/.config/polybar/scripts/pipewire-volume.sh
format-prefix = 
format-prefix-foreground = ${colors.primary}
interval = 1
click-left = pactl set-sink-volume @DEFAULT_SINK@ +5%
click-right = pactl set-sink-volume @DEFAULT_SINK@ -5%
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/battery]
type = internal/battery

full-at = 99
low-at = 5

battery = BAT0
adapter = ADP1

poll-interval = 5

format-full = 󱊣

label-charging = %{F#B294BB}󱊣%{F-} %percentage%%
label-discharging = %{F#B294BB}󱊣%{F-} %percentage%%
label-full = %{F#B294BB}󱊣%{F-} %percentage%%

[settings]
screenchange-reload = true
pseudo-transparency = true

